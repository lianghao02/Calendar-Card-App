<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悠樂芳行事曆 | Young Living Calendar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#526F94">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="家庭行事曆">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>

<body>
    <header>
        <div class="header-top">
            <h1><span class="icon" aria-hidden="true">📅</span><span id="current-month-year">2026 年 1 月</span></h1>
            <div class="nav-controls" aria-label="日期導覽">
                <button type="button" class="btn-icon" id="prev-btn" aria-label="上一個月或上一週">‹</button>
                <button type="button" class="btn-cancel" id="today-btn">今天</button>
                <button type="button" class="btn-icon" id="next-btn" aria-label="下一個月或下一週">›</button>
            </div>
        </div>
        <div class="calendar-actions">
            <div class="view-toggle" aria-label="行事曆檢視">
                <button type="button" class="btn-toggle" id="view-week" aria-pressed="false">週</button>
                <button type="button" class="btn-toggle active" id="view-month" aria-pressed="true">月</button>
            </div>
            <button type="button" class="btn-primary requires-edit" id="add-event-btn">＋新增行程</button>
            <button type="button" class="btn-cancel" id="select-mode-btn" aria-pressed="false">選日期</button>
            <button type="button" class="btn-cancel" id="share-btn">分享</button>
        </div>
        <p id="selected-date-label" class="calendar-context"></p>
        <div class="sync-toolbar" aria-label="帳號與資料備份">
            <div class="sync-line">
                <p id="sync-status" role="status" aria-live="polite">讀取行事曆中…</p>
                <button type="button" class="btn-primary" id="login-btn" hidden>Google 登入</button>
                <details id="account-menu">
                    <summary class="btn-cancel">帳號與資料</summary>
                    <div class="account-content">
                        <p id="account-label"></p>
                        <div class="sync-actions">
                            <button type="button" class="btn-cancel" id="backup-btn">匯出完整備份</button>
                            <button type="button" class="btn-cancel" id="import-btn" hidden>匯入家庭行程</button>
                            <button type="button" class="btn-cancel" id="logout-btn" hidden>登出</button>
                        </div>
                        <details class="legacy-options"><summary>舊版／本機資料</summary>
                            <button type="button" class="btn-cancel" id="legacy-backup-btn">匯出舊版／本機資料</button>
                        </details>
                        <input type="file" id="backup-file" accept=".json,application/json" hidden aria-label="選擇行事曆備份">
                    </div>
                </details>
            </div>
            <p id="login-help" hidden>手機請用 Safari 或 Chrome 開啟此網址登入。</p>
        </div>
        <div class="smart-input-container">
            <label class="sr-only" for="smart-input">智慧輸入行程</label>
            <textarea id="smart-input" class="smart-input requires-edit" rows="1" placeholder="智慧輸入，例如：明天 18:00 家庭聚餐"></textarea>
            <button type="button" id="smart-submit-btn" class="btn-send requires-edit" aria-label="解析行程">送出</button>
        </div>
    </header>

    <main class="calendar-container" id="calendar-grid">
        <!-- Day Cards will be generated here by JS -->
    </main>

    <!-- Selected Day Events (Mobile Split View) -->
    <div id="selected-day-events" class="selected-day-events">
        <!-- Events for the selected day will appear here -->
    </div>

    <!-- Modal for adding/editing events -->
    <dialog class="modal-overlay" id="event-modal" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">新增事件</h2>
                <button class="close-modal" id="close-modal" aria-label="關閉行程表單">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label class="input-label" for="event-date-picker">日期 (Date)</label>
                    <input type="date" class="input-field" id="event-date-picker">
                </div>
                <div class="input-group">
                    <label class="input-label" for="event-input">活動標題 (Title)</label>
                    <input type="text" maxlength="200" class="input-field" id="event-input" placeholder="輸入標題 (例如：週二夜來香)...">
                </div>
                <div class="input-group">
                    <label class="input-label" for="event-time">時間 (Time)</label>
                    <input type="text" class="input-field" id="event-time" placeholder="例如：10:00, 20:00 或留空">
                </div>
                <div class="input-group">
                    <label class="input-label" for="event-recurrence">重複設定 (Recurrence)</label>
                    <select class="input-field" id="event-recurrence" aria-label="重複設定 (Recurrence)">
                        <option value="none" selected>不重複</option>
                        <option value="weekly_current_month">每週 (直到本月底)</option>
                        <option value="weekly_3_month">每週 (未來 3 個月)</option>
                        <option value="custom">自訂結束日期...</option>
                    </select>
                    <div id="recurrence-info" class="input-help-text"></div>
                </div>
                <div class="input-group" id="recurrence-end-date-group" hidden>
                    <label class="input-label" for="event-recurrence-end">結束日期 (End Date)</label>
                    <input type="date" class="input-field" id="event-recurrence-end">
                </div>
                <div class="input-group">
                    <label class="input-label" for="event-location">地點 (Location)</label>
                    <input type="text" class="input-field" id="event-location" placeholder="輸入地點...">
                </div>
                <div class="input-group">
                    <label class="input-label" for="event-description">附註 (Note)</label>
                    <textarea class="input-field" id="event-description" rows="3" placeholder="詳細內容、備註..."></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label" for="event-link">相關連結 (Link)</label>
                    <div class="u-flex-gap-sm">
                        <input type="text" class="input-field u-flex-1" id="event-link" placeholder="https://...">
                        <button type="button" id="open-link-btn" class="btn-primary btn-addon">開啟</button>
                    </div>
                </div>
                <p id="event-author" class="event-author"></p>
                <p id="form-feedback" class="form-feedback" role="alert" hidden></p>
                <input type="hidden" id="selected-date">
            </div>
            <div class="modal-footer">
                <button class="btn-delete" id="delete-btn">刪除</button>
                <button class="btn-cancel" id="cancel-btn">取消</button>
                <button class="btn-primary" id="save-btn">儲存</button>
            </div>
        </div>
    </dialog>

    <!-- Event Selection Modal (Mobile > 1 event) -->
    <dialog class="modal-overlay modal-event-list-overlay" id="event-list-modal-overlay" aria-labelledby="event-list-title">
        <div class="modal modal-event-list-content">
            <div class="modal-header">
                <h3 class="modal-title" id="event-list-title">選擇行程</h3>
                <button class="btn-icon" id="close-event-list-modal" aria-label="關閉行程列表">✕</button>
            </div>
            <div class="modal-body modal-event-list-body" id="event-list-container">
                <!-- List injected here -->
            </div>
            <div class="modal-footer">
                <button class="btn-primary u-w-full" id="add-from-list-btn">+ 新增此日行程</button>
            </div>
        </div>
    </dialog>

    <!-- Share Modal -->
    <dialog class="modal-overlay" id="share-modal-overlay" aria-labelledby="share-title">
        <div class="modal share-modal">
            <div class="modal-header">
                <h2 class="modal-title" id="share-title">分享行程</h2>
                <button class="close-modal" id="close-share-modal" aria-label="關閉分享">&times;</button>
            </div>
            <div class="share-preview-container">
                <label class="input-label">內容預覽</label>
                <textarea id="share-text-preview" readonly aria-label="分享預覽內容"></textarea>
            </div>
            <div class="share-actions">
                <button class="social-btn btn-line" id="share-line">
                    <span class="icon">💬</span> LINE
                </button>
                <button class="social-btn btn-messenger" id="share-messenger">
                    <span class="icon">⚡</span> Messenger
                </button>
                <button class="social-btn btn-copy" id="share-copy">
                    <span class="icon">📋</span> 複製文字
                </button>
            </div>
        </div>
    </dialog>

    <dialog class="modal-overlay" id="import-modal" aria-labelledby="import-title">
        <div class="modal">
            <div class="modal-header"><h2 id="import-title">家庭行程匯入預覽</h2></div>
            <div class="modal-body">
                <p>確認後，以下內容會提供給所有核准家人查看與編輯。原資料會保留。</p>
                <p id="import-summary" role="status"></p>
                <div id="import-preview"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="import-cancel">取消</button>
                <button type="button" class="btn-primary" id="import-confirm">確認匯入家庭行程</button>
            </div>
        </div>
    </dialog>
    <dialog class="modal-overlay" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="modal">
            <h2 class="modal-title" id="confirm-title">確認操作</h2>
            <p id="confirm-message" class="confirmation-message"></p>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="confirm-no">返回</button>
                <button type="button" class="btn-primary" id="confirm-yes">確認</button>
            </div>
        </div>
    </dialog>
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay u-hidden">
        <div class="spinner"></div>
        <div class="loading-text">資料同步中...</div>
    </div>

    <!-- 行動端專屬智慧輸入彈窗 (Mobile Smart Input Dialog) -->
    <dialog class="modal-overlay" id="mobile-smart-dialog" aria-labelledby="mobile-smart-title">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="mobile-smart-title">✨ 智慧新增行程</h2>
                <button type="button" class="close-modal" id="close-mobile-smart" aria-label="關閉智慧輸入">✕</button>
            </div>
            <div class="modal-body">
                <label for="mobile-smart-input" class="sr-only">請輸入時間與事項（自然語言解析）：</label>
                <textarea id="mobile-smart-input" class="smart-input u-w-full" rows="3" placeholder="例如：明天 18:00 家庭聚餐、每週五 14:00 會議、3/25 買菜"></textarea>
                <p class="input-help-text" style="display:block;margin-top:0.5rem;color:var(--text-secondary);">
                    支援「明天/後天/下週幾」、「HH:MM」時間、重複週期或指定地點。
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancel-mobile-smart">取消</button>
                <button type="button" class="btn-primary" id="mobile-smart-submit">解析並新增</button>
            </div>
        </div>
    </dialog>

    <!-- 手機端固定底部操作列 (Mobile Bottom Navigation & Action Bar) -->
    <nav class="mobile-bottom-bar" id="mobile-bottom-bar" aria-label="行動快捷操作">
        <div class="bar-group">
            <button type="button" class="bar-btn" id="mobile-view-toggle" aria-label="切換週或月檢視">
                <span class="bar-icon" id="mobile-view-icon" aria-hidden="true">📅</span>
                <span class="bar-label" id="mobile-view-text">週檢視</span>
            </button>
            <button type="button" class="bar-btn" id="mobile-today-btn" aria-label="回到今天">
                <span class="bar-icon" aria-hidden="true">🎯</span>
                <span class="bar-label">今天</span>
            </button>
        </div>

        <button type="button" class="bar-fab requires-edit" id="mobile-add-btn" aria-label="新增行程" title="新增行程">
            <span class="fab-icon" aria-hidden="true">＋</span>
            <span class="fab-label">新增</span>
        </button>

        <div class="bar-group">
            <button type="button" class="bar-btn requires-edit" id="mobile-smart-btn" aria-label="智慧輸入行程">
                <span class="bar-icon" aria-hidden="true">✨</span>
                <span class="bar-label">智慧輸入</span>
            </button>
            <button type="button" class="bar-btn" id="mobile-share-btn" aria-label="分享行程">
                <span class="bar-icon" aria-hidden="true">📤</span>
                <span class="bar-label">分享</span>
            </button>
        </div>
    </nav>

    <footer class="site-footer">© 2025 Young Living Calendar・v1.1.2 (Build 36)・Chia-Hao</footer>

    <script src="google_api_config.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('Service Worker 註冊失敗:', err);
                });
            });
        }
    </script>
</body>

</html>
